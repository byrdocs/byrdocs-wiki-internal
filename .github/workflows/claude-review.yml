name: Claude Auto Review

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (read-only)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      # The workspace now holds untrusted fork code, so the review instructions
      # must NOT be read from it: a fork PR could rewrite .github/prompts/review.md
      # and have this job execute it with the base repo's secrets. Always take the
      # prompts from the base branch, which only maintainers can write to.
      # Use base.ref (branch tip) rather than base.sha: for older PRs base.sha can
      # predate a newly added prompt file and 404.
      - name: Fetch trusted prompts from base branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prompts
          for f in review.md security-guardrails.md; do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${REPO}/contents/.github/prompts/${f}?ref=${BASE_REF}" \
              > "/tmp/prompts/${f}"
            test -s "/tmp/prompts/${f}"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write MCP config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/mcp.json <<JSON
          {
            "mcpServers": {
              "github": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-github"],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                }
              }
            }
          }
          JSON

      - name: Run Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: "anthropic/claude-opus-4.7"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYRDOCS_SITE_TOKEN: ${{ secrets.BYRDOCS_SITE_TOKEN }}
          DEBUG: "true"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          REVIEW_PROMPT=$(cat /tmp/prompts/review.md)
          GUARDRAILS=$(cat /tmp/prompts/security-guardrails.md)

          claude -p "You are reviewing PR #${PR_NUMBER} in ${REPO}.

          ${REVIEW_PROMPT}" \
            --model opus \
            --mcp-config /tmp/mcp.json \
            --output-format stream-json \
            --permission-mode bypassPermissions \
            --append-system-prompt "${GUARDRAILS}" \
            --verbose
